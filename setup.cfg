[metadata]
name = keka-sdk
author = Your Name
author_email = your.email@example.com
description = A Python SDK for interacting with the Keka HR API
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/yourusername/keka-sdk
project_urls =
    Bug Reports = https://github.com/yourusername/keka-sdk/issues
    Source = https://github.com/yourusername/keka-sdk
    Documentation = https://developers.keka.com/reference
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Topic :: Software Development :: Libraries :: Python Modules
    Topic :: Office/Business :: Human Resources
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
install_requires = 
    httpx>=0.24.0
include_package_data = True
zip_safe = False

[options.packages.find]
exclude =
    tests*
    docs*

[options.extras_require]
dev = 
    pytest>=7.0.0
    pytest-asyncio>=0.21.0
    pytest-cov>=4.0.0
    black>=23.0.0
    flake8>=6.0.0
    mypy>=1.0.0
    pre-commit>=3.0.0
docs = 
    sphinx>=5.0.0
    sphinx-rtd-theme>=1.2.0
    myst-parser>=1.0.0

[bdist_wheel]
universal = 0

[egg_info]
tag_build = 
tag_date = 0
